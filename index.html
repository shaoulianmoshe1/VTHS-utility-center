<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTHS Student Life Utility</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; color: #0f172a; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 5px; }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            border-left: 4px solid var(--primary);
            display: none;
        }

        .warning { color: #dc2626; font-weight: bold; }
        .success { color: #059669; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VTHS Utility Center</h1>
        <p>Student Life Utility App</p>
    </header>

    <div class="card">
        <h2>📊 Grade Calculator</h2>
        <div class="input-group">
            <label>Enter grades separated by commas:</label>
            <input type="text" id="gradeInput" placeholder="e.g. 95, 82, 77, 100">
        </div>
        <button onclick="calculateGrades()">Calculate Results</button>
        <div id="gradeResult" class="result"></div>
    </div>

    <div class="card">
        <h2>🔄 Unit Converter</h2>
        <div class="grid">
            <div class="input-group">
                <label>Category:</label>
                <select id="convCat" onchange="updateUnits()">
                    <option value="dist">Distance</option>
                    <option value="temp">Temperature</option>
                    <option value="weight">Weight</option>
                    <option value="time">Time</option>
                </select>
            </div>
            <div class="input-group">
                <label>Conversion:</label>
                <select id="convSub"></select>
            </div>
        </div>
        <div class="input-group">
            <label>Value:</label>
            <input type="number" id="convVal" placeholder="Enter number">
        </div>
        <button onclick="convertUnits()">Convert Now</button>
        <div id="convResult" class="result"></div>
    </div>

    <div class="card">
        <h2>💰 Advanced Budget Helper</h2>
        <div class="input-group">
            <label>Total Monthly Budget ($):</label>
            <input type="number" id="bTotal" value="1000">
        </div>
        <div class="grid">
            <div class="input-group"><label>Food Budget ($):</label><input type="number" id="bFood" value="200"></div>
            <div class="input-group"><label>Food Spent ($):</label><input type="number" id="sFood" value="0"></div>
            <div class="input-group"><label>Trans Budget ($):</label><input type="number" id="bTrans" value="100"></div>
            <div class="input-group"><label>Trans Spent ($):</label><input type="number" id="sTrans" value="0"></div>
            <div class="input-group"><label>Ent Budget ($):</label><input type="number" id="bEnt" value="100"></div>
            <div class="input-group"><label>Ent Spent ($):</label><input type="number" id="sEnt" value="0"></div>
            <div class="input-group"><label>Other Budget ($):</label><input type="number" id="bOther" value="50"></div>
            <div class="input-group"><label>Other Spent ($):</label><input type="number" id="sOther" value="0"></div>
        </div>
        <button onclick="calculateBudget()">Analyze Budget</button>
        <div id="budgetResult" class="result"></div>
    </div>
</div>

<script>
    // --- GRADE LOGIC ---
    function calculateGrades() {
        const input = document.getElementById('gradeInput').value;
        const grades = input.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
        if (grades.length === 0) return;

        let total = 0, highest = -1, lowest = 101;
        grades.forEach(g => {
            total += g;
            if (g > highest) highest = g;
            if (g < lowest) lowest = g;
        });

        const avg = total / grades.length;
        let letter = "F", gpa = 0.0, msg = "⚠️ Need improvement";

        if (avg >= 90) { letter = "A"; msg = "🎉 Excellent work!"; }
        else if (avg >= 80) { letter = "B"; msg = "✅ Great job!"; }
        else if (avg >= 70) { letter = "C"; msg = "👍 Good effort!"; }
        else if (avg >= 60) { letter = "D"; msg = "📚 Keep studying!"; }

        if (avg >= 93) gpa = 4.0; else if (avg >= 90) gpa = 3.7;
        else if (avg >= 87) gpa = 3.3; else if (avg >= 83) gpa = 3.0;
        else if (avg >= 80) gpa = 2.7; else if (avg >= 77) gpa = 2.3;
        else if (avg >= 73) gpa = 2.0; else if (avg >= 70) gpa = 1.7;
        else if (avg >= 67) gpa = 1.3; else if (avg >= 60) gpa = 1.0;

        const res = document.getElementById('gradeResult');
        res.style.display = 'block';
        res.innerHTML = `Total Grades: ${grades.length}\nAverage: ${avg.toFixed(2)}\nHighest: ${highest}\nLowest: ${lowest}\nLetter Grade: ${letter}\nGPA: ${gpa}\n\n${msg}`;
    }

    // --- CONVERTER LOGIC ---
    const units = {
        dist: ["Miles → Km", "Km → Miles", "Feet → Meters", "Meters → Feet"],
        temp: ["Celsius → Fahrenheit
